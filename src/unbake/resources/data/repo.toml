# Generated game-repository files (repo.py). Action and image pins are full digests. The tool state directory
# ignores itself (process.state), so the project's .gitignore never names it.
schema = 1
ignore = ["/.env", "/asm/", "/build/", "/roms/", "/tools/", "/local.mk", "*.z64", "*.n64", "*.v64"]

# The splat pins a build extracts with (`make extract`): CONTRIBUTING names them.
splat_pip = ["splat64[mips]==0.50.0", "spimdisasm==1.42.4"]

# splat options init writes into each versions/<version>/<name>.yaml (placeholders {version} {name} {rom}).
[splat.options]
base_path = "../.."
target_path = "{rom}"
basename = "{name}"
asm_path = "asm/{version}"
src_path = "src"
build_path = "build/{version}"
asset_path = "asm/{version}/assets"
symbol_addrs_path = "versions/{version}/symbol_addrs.txt"
ld_script_path = "build/{version}/splat.ld"
generated_asm_macros_directory = "asm/{version}"
undefined_funcs_auto_path = "build/{version}/undefined_funcs_auto.txt"
undefined_syms_auto_path = "build/{version}/undefined_syms_auto.txt"
# splat names what no symbol file names with its own spelling, so a table name never means a second address
symbol_name_format = "auto_$VRAM"
symbol_name_format_no_rom = "auto_$VRAM"
# splat must never write C files: it would overwrite the tracked sources
create_c_files = false
# no C file lists the INCLUDE_ASM names splat would read, so every function is written, all into nonmatchings/
disassemble_all = true
matchings_path = "nonmatchings"
# a function file is assembled on its own, as a data file is: it brings its own macros
asm_inc_header = ".include \"macro.inc\"\n\n"
migrate_rodata_to_functions = true
platform = "n64"

# One generated CI file per row: a thin wrapper that only calls `sh ci/run <stage>`. The values fill the template.
[[forge]]
path = ".github/workflows/ci.yml"
template = "ci.yml.in"
[forge.values]
checkout = "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0"

[[forge]]
path = ".gitlab-ci.yml"
template = "gitlab-ci.yml.in"
[forge.values]
image = "python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f"
packages = "make"

# Make variable -> host tool key (local.mk value) and the conventional command the committed Makefile falls back to.
[make.tools.CPP]
host = "cpp"
default = "cpp"
[make.tools.AS]
host = "mips_as"
default = "mips-linux-gnu-as"
[make.tools.LD]
host = "mips_ld"
default = "mips-linux-gnu-ld"
[make.tools.OBJCOPY]
host = "mips_objcopy"
default = "mips-linux-gnu-objcopy"
[make.tools.N64LINK]
host = "n64link"
default = "n64link"
# a pinned release the committed Makefile fetches into tools/<host>/ like a compiler (no local path, no PATH)
title = "n64link (SN ASN64-compatible assembler and linker)"
binary = "n64link"
dependency = { name = "n64link", repository = "https://github.com/AbuN64/mas-n64" }  # the README link: the source repository, never a download
[make.tools.N64LINK.download]
url = "https://github.com/AbuN64/mas-n64/releases/download/v0.2.0/n64link-v0.2.0-linux-x86_64.tar.gz"
sha256 = "061d7bc69f21228c7029f4f530cd980bab3a35749751a43f2823d03d95be4ef7"
files = ["n64link-v0.2.0-linux-x86_64/n64link"]
strip = 1
[make.tools.N64LINK.pins]
"n64link" = "583e544840d04123fa7e26c7416316ffe410139351e07cd3395d4bd5ec609c3c"
[make.tools.SPLAT]
host = "splat"
default = "splat"

# Where a module's public header may live (move.header check) and where its sources sit (Group.subsystem, Group.library).
[layout]
subsystem_header = "include/game/{subsystem}.h"
library_header = "include/sdk/{library}.h"
shared_headers = ["include/types.h", "include/game/common.h"]
subsystem_source = "src/game/{subsystem}"
library_source = "src/sdk/{library}"
module_cap = 32  # most functions an inferred module holds

[readme]
begin = "<!-- progress -->"
end = "<!-- /progress -->"
bar = 20
dependencies_begin = "<!-- dependencies -->"  # the build tools the Makefile fetches, each a link to its source repository
dependencies_end = "<!-- /dependencies -->"
map_width = 720  # px: the memory map in the README is a thumbnail of the full render
