# Generated game-repository files (repo.py). Action and image pins are full digests. The tool state directory
# ignores itself (process.state), so the project's .gitignore never names it; .abu/ holds the agent rules of a repo.
schema = 1
ignore = ["/.env", "/asm/", "/build/", "/roms/", "/tools/", "/local.mk", "*.z64", "*.n64", "*.v64", ".abu/"]

# The files git reads beside the ignore list (`unbake sync` writes .gitignore and .gitattributes from these):
# `union` globs merge by line union (row files), `linguist` globs are counted as C by the forge's language statistics.
union = ["versions/*/symbol_addrs.txt", "versions/*/aliases.txt"]
linguist = ["*.CPP", "*.H"]

# The licence `unbake sync` writes as LICENSE (templates/LICENSE.in is its text; the READMEs link it).
license = "CC0-1.0"

# The splat pins a build extracts with (`make extract`): CONTRIBUTING names them.
splat_pip = ["splat64[mips]==0.50.0", "spimdisasm==1.42.4"]

# Project input files that are not at the root, repo-relative. A project names its own under config.toml [paths].
# `prose` lists the text files outside src/ and include/ that name symbols in sentences: they are renamed with them.
[paths]
platform = "rom.toml"
blobs = "blobs.toml"
prose = ["docs/sweep.toml"]

# splat options init writes into each versions/<version>/<name>.yaml (placeholders {version} {name} {rom}).
[splat.options]
base_path = "../.."
target_path = "{rom}"
basename = "{name}"
asm_path = "asm/{version}"
src_path = "src"
build_path = "build/{version}"
asset_path = "asm/{version}/assets"
symbol_addrs_path = "versions/{version}/symbol_addrs.txt"
ld_script_path = "build/{version}/splat.ld"
generated_asm_macros_directory = "asm/{version}"
undefined_funcs_auto_path = "build/{version}/undefined_funcs_auto.txt"
undefined_syms_auto_path = "build/{version}/undefined_syms_auto.txt"
# splat names what no symbol file names with its own spelling, so a table name never means a second address
symbol_name_format = "auto_$VRAM"
symbol_name_format_no_rom = "auto_$VRAM"
# splat must never write C files: it would overwrite the tracked sources
create_c_files = false
# no C file lists the INCLUDE_ASM names splat would read, so every function is written, all into nonmatchings/
disassemble_all = true
matchings_path = "nonmatchings"
# a function file is assembled on its own, as a data file is: it brings its own macros
asm_inc_header = ".include \"macro.inc\"\n\n"
migrate_rodata_to_functions = true
platform = "n64"

# One generated CI file per row: a thin wrapper that only calls `sh ci/run <stage>`. The values fill the template.
[[forge]]
path = ".github/workflows/ci.yml"
template = "ci.yml.in"
[forge.values]
checkout = "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0"

[[forge]]
path = ".gitlab-ci.yml"
template = "gitlab-ci.yml.in"
[forge.values]
image = "python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f"
packages = "make"

# Make variable -> host tool key (local.mk value) and the conventional command the committed Makefile falls back to.
[make.tools.CPP]
host = "cpp"
default = "cpp"
[make.tools.AS]
host = "mips_as"
default = "mips-linux-gnu-as"
[make.tools.LD]
host = "mips_ld"
default = "mips-linux-gnu-ld"
[make.tools.OBJCOPY]
host = "mips_objcopy"
default = "mips-linux-gnu-objcopy"
[make.tools.ABUMAS]
host = "abumas"
default = "abumas"
# a pinned release the committed Makefile fetches into tools/<host>/ like a compiler (no local path, no PATH)
title = "abumas (SN ASN64-compatible assembler and linker)"
binary = "abumas"
dependency = { name = "abumas", repository = "https://github.com/AbuN64/mas-n64" }  # the README link: the source repository, never a download
[make.tools.ABUMAS.download]
url = "https://github.com/AbuN64/mas-n64/releases/download/v0.5.0/abumas-v0.5.0-linux-x86_64.tar.gz"
sha256 = "9173e4f2f3bad16d94eaf149cbe09e5363060dcdf72fa64f6f66fc7b7bdb9e03"
files = ["abumas-v0.5.0-linux-x86_64/abumas"]
strip = 1
[make.tools.ABUMAS.pins]
"abumas" = "0fe945e19ccfb49b2b6cebd42d93de6de52c9bd811a8f4b0275c074050f6d418"
[make.tools.SPLAT]
host = "splat"
default = "splat"

# Where a module's public header may live (move.header check) and where its sources sit (Group.subsystem, Group.library).
# `source_roots` are the top folders holding compiled sources and `header_roots` the folders includes are written against;
# the sibling toolkits (recipemaker, abu_decomp) read them through `unbake.api.layout`. These values are the defaults: a
# project's config.toml [layout] replaces any key here, and its [cheat] any key of [cheat] below.
[layout]
subsystem_header = "include/game/{subsystem}.h"
library_header = "include/sdk/{library}.h"
shared_headers = ["include/types.h", "include/game/common.h"]
subsystem_source = "src/game/{subsystem}"
library_source = "src/sdk/{library}"
source_roots = ["src"]
header_roots = ["include"]
module_cap = 32  # most functions an inferred module holds

[readme]
begin = "<!-- progress -->"
end = "<!-- /progress -->"
bar = 20
dependencies_begin = "<!-- dependencies -->"  # the build tools the Makefile fetches, each a link to its source repository
dependencies_end = "<!-- /dependencies -->"
map_width = 720  # px: the memory map in the README is a thumbnail of the full render

# The no-cheat check (cheat.py): what a change over a base may not add. `infra` and `facts` are git pathspecs, `source`
# the roots whose added lines are scanned, `added` regexes over one added source line (a stand-in line that is what
# sync generates is exempt), `makefile_row` the one Makefile line shape that may change by hand (a unit's own compiler).
[cheat]
infra = ["local.mk", "include/include_asm.h", "${platform}", "roms", "tools", "ci", "asm"]
facts = ["config.toml", "versions", "${blobs}"]
blobs = ["${blobs}"]  # a facts file that changes the counting: when it differs, `blobs.verify` must pass
source = ["src", "include"]
declaration_files = '\.(h|H)$'  # a header under a source root in infra: declaration-only edits are not infrastructure
asm_home = ["src/sdk/"]  # path prefixes where a new `.s` may be added if every global symbol it defines is handwritten
source_suffix = '\.(c|C|CPP|cpp|h|H|inc)$'
makefile_row = '^(FILE|CPPFLAGS|CFLAGS)\.src/[^ ]+ :='
added = [
  '\basm\s*\(', '__asm', 'GLOBAL_ASM', 'INCLUDE_RODATA', '\.incbin', '^\s*\.word\b', '"\s*\.word\b', ';\s*\.word\b',
  '#\s*(un)?define\s+NON_MATCHING', '#\s*pragma', '__attribute__\s*\(\(\s*section',
]
