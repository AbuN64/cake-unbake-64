# The whole command surface. cli.py builds click commands from this table and calls `handler` (module.function)
# with (config, params) -- init gets (params) only. Option names map to params keys with "-" replaced by "_".
# Global options --host (or UNBAKE_HOST) and --project (default: the working directory) are added by cli.py to
# every command; init gets only --host. Every successful result validates against schemas/result.<command>.schema.json.
schema = 2

[command.init]
configured = false
help = "Create a project from one or more ROMs of the same game and an explicit toolchain."
handler = "repo.init"
params = [
  { name = "dir", kind = "argument", type = "path", required = true, multiple = false, help = "new empty project directory" },
  { name = "rom", kind = "option", type = "str", required = true, multiple = true, help = "VERSION=PATH, once per version" },
  { name = "names-from", kind = "option", type = "str", required = true, multiple = false, help = "version whose symbol names are canonical" },
  { name = "toolchain", kind = "option", type = "str", required = true, multiple = false, help = "toolchain id from toolchains.toml" },
  { name = "name", kind = "option", type = "str", required = true, multiple = false, help = "short project name (file stem)" },
  { name = "title", kind = "option", type = "str", required = true, multiple = false, help = "game title" },
]

[command.setup]
help = "Install toolchains, extract every version, write the generated files and check that every version links to its ROM; one pass, uncommitted."
handler = "repo.setup"
params = [
  { name = "no-make", kind = "flag", type = "str", required = false, multiple = false, help = "prepare only (toolchains, extraction, generated files): the caller builds and runs unbake verify itself" },
]

[command.sync]
help = "Write the generated Makefile, link script, split yamls and CI files, and a stand-in line for every symbol no source owns; --check writes nothing and refuses when a file would change."
handler = "repo.sync"
params = [
  { name = "check", kind = "flag", type = "str", required = false, multiple = false, help = "write nothing; refuse naming the files that would change" },
  { name = "settle", kind = "flag", type = "str", required = false, multiple = false, help = "write, then refuse as --check would unless a second sync would write nothing (sync and sync --check in one run)" },
  { name = "makefile", kind = "flag", type = "str", required = false, multiple = false, help = "also regenerate an existing Makefile (otherwise sync leaves a tree's Makefile as it is; it writes one only when absent)" },
  { name = "place", kind = "option", type = "str", required = false, multiple = true, help = "a function whose read-only data (jump tables, literal pools) its own file now compiles: add the literals_ row per version that places it there (refuses data other functions read); with --check only list the rows" },
]

[command.symbols]
help = "The symbol facts of one version (name, vram, rom, size, type), or of every version."
handler = "repo.symbols_command"
params = [
  { name = "version", kind = "option", type = "str", required = false, multiple = false, help = "only this version" },
  { name = "missing", kind = "flag", type = "str", required = false, multiple = false, help = "report the names the assembly uses that no fact defines, by provenance, instead of the facts" },
  { name = "write", kind = "flag", type = "str", required = false, multiple = false, help = "with --missing: add the placeable ones (RAM, register and offset constants) to versions/<v>/symbol_addrs.txt" },
]

[command.compare]
help = "Measure a source against every version that holds its item and report the gaps; writes nothing (submit puts an exact source in the landing inbox)."
handler = "compare.run"
params = [
  { name = "file", kind = "argument", type = "path", required = true, multiple = false, help = "C source" },
  { name = "function", kind = "option", type = "str", required = false, multiple = false, help = "member the file implements when its name does not say" },
  { name = "out", kind = "option", type = "path", required = false, multiple = false, help = "new directory for artifacts" },
  { name = "note", kind = "option", type = "str", required = false, multiple = false, help = "a free-text note recorded with the submission" },
  { name = "widen", kind = "option", type = "str", required = false, multiple = false, help = "V,..: port the C the --from version matches in FILE to these versions (guards widened, their data symbols read from the code, sync --place, scored exact in each or nothing kept); writes the tree and a diff" },
  { name = "from", kind = "option", type = "str", required = false, multiple = false, help = "with --widen: the version whose C is ported (default: the project names_from)" },
  { name = "check", kind = "flag", type = "str", required = false, multiple = false, help = "with --widen: show the edits and derived symbols, write nothing" },
]

[command.score]
help = "Score one candidate source in one version and write nothing: no journal, no inbox, no landing; shows the instruction diff."
handler = "compare.score_command"
params = [
  { name = "file", kind = "argument", type = "path", required = false, multiple = false, help = "C source (omit with --variants)" },
  { name = "extras", kind = "argument", type = "path", required = false, multiple = true, help = "change-set files as submit takes them: PATH=FILE overlays the project file PATH (a header) with FILE for this score only" },
  { name = "function", kind = "option", type = "str", required = false, multiple = false, help = "member the file implements when its name does not say" },
  { name = "version", kind = "option", type = "str", required = false, multiple = false, help = "version to score, default the names-from version when it holds the item" },
  { name = "toolchain", kind = "option", type = "str", required = false, multiple = false, help = "override the unit toolchain" },
  { name = "flag", kind = "option", type = "str", required = false, multiple = true, help = "add one compiler option" },
  { name = "omit-flag", kind = "option", type = "str", required = false, multiple = true, help = "remove one compiler option (with its operand)" },
  { name = "lines", kind = "option", type = "int", required = false, multiple = false, help = "instruction diff lines to show, default 80" },
  { name = "short", kind = "flag", type = "str", required = false, multiple = false, help = "print only the verdict, the first difference and the diff lines as JSON: no stage tree or proofs (a few hundred bytes)" },
  { name = "variants", kind = "option", type = "path", required = false, multiple = false, help = "JSON list of {file, overlays}: score every candidate in this one process, all cores, stdout JSON per variant" },
  { name = "alloc", kind = "flag", type = "str", required = false, multiple = false, help = "compile once more with the register allocation dumps and name, per register the target fills differently, the pseudo that won it, its priority and what would flip it, and per moved load or store the scheduler's priority, dependencies and tie" },
  { name = "permute", kind = "option", type = "int", required = false, multiple = false, help = "run decomp-permuter on the function for this many seconds (nice, at most 8 jobs) instead of scoring: its best body is spliced into a copy of FILE (--out) for recipe try; the scores are the permuter's, lower is closer" },
  { name = "permuter", kind = "option", type = "path", required = false, multiple = false, help = "the permuter executable (default $UNBAKE_PERMUTER)" },
  { name = "jobs", kind = "option", type = "int", required = false, multiple = false, help = "permuter threads, default min(8, host workers)" },
  { name = "out", kind = "option", type = "path", required = false, multiple = false, help = "with --permute, where the permuted candidate goes, default FILE.permuted.c" },
  { name = "keep-dumps", kind = "option", type = "path", required = false, multiple = false, help = "with --alloc (implied): copy the compile's gcc dumps (.greg, .lreg, .sched, .sched2, the -g assembly and its .i) into DIR, which outlives the command" },
  { name = "quick", kind = "flag", type = "str", required = false, multiple = false, help = "with --alloc: skip the source rules (about 13 s of the command) and print the allocation table in seconds" },
]

[command.probe]
help = "Compile only the module that owns one function, the candidate in place of its stand-in, in one version, and diff the function against the ROM in about a second: score's measure without the tree capture, source rules or other versions. Writes nothing but --dumps DIR."
handler = "compare.probe_command"
params = [
  { name = "file", kind = "argument", type = "path", required = true, multiple = false, help = "C source" },
  { name = "extras", kind = "argument", type = "path", required = false, multiple = true, help = "change-set files as score takes them: PATH=FILE overlays the project file PATH (a header) with FILE" },
  { name = "function", kind = "option", type = "str", required = false, multiple = false, help = "member the file implements, default the first function it defines" },
  { name = "version", kind = "option", type = "str", required = false, multiple = false, help = "version to probe, default the names-from version" },
  { name = "toolchain", kind = "option", type = "str", required = false, multiple = false, help = "override the unit toolchain" },
  { name = "flag", kind = "option", type = "str", required = false, multiple = true, help = "add one compiler option" },
  { name = "omit-flag", kind = "option", type = "str", required = false, multiple = true, help = "remove one compiler option (with its operand)" },
  { name = "lines", kind = "option", type = "int", required = false, multiple = false, help = "instruction diff lines to show, default 80" },
  { name = "short", kind = "flag", type = "str", required = false, multiple = false, help = "show only the changed diff lines (40 by default)" },
  { name = "dumps", kind = "option", type = "path", required = false, multiple = false, help = "copy every pass dump of the compile (-da where the toolchain takes it), its -g assembly, its .i and the whole instruction diff into DIR" },
]

[command.whatif]
help = "Compile one function's candidate with the scheduler told one thing more (artificial dependences A>B, or the single-set top priority off for chosen insns), made in the toolchain's own cc1 under a batch gdb, and score it like probe; --search finds the smallest change set that makes it exact."
handler = "whatif.whatif_command"
params = [
  { name = "file", kind = "argument", type = "path", required = true, multiple = false, help = "C source" },
  { name = "extras", kind = "argument", type = "path", required = false, multiple = true, help = "change-set files as for probe" },
  { name = "function", kind = "option", type = "str", required = false, multiple = false, help = "member the file implements" },
  { name = "version", kind = "option", type = "str", required = false, multiple = false, help = "version to compile, default the names-from version" },
  { name = "toolchain", kind = "option", type = "str", required = false, multiple = false, help = "override the unit's toolchain" },
  { name = "flag", kind = "option", type = "str", required = false, multiple = true, help = "add one compiler option" },
  { name = "omit-flag", kind = "option", type = "str", required = false, multiple = true, help = "remove one compiler option" },
  { name = "kind", kind = "option", type = "str", required = false, multiple = false, help = "deps (default): add scheduler dependences; top-priority: turn the single-set top priority off for --insn UIDs" },
  { name = "dep", kind = "option", type = "str", required = false, multiple = true, help = "A>B[:KIND]: insn A depends on insn B (stays after it); uids as the sched1 dump (-dS) shows; KIND anti (default), output or true" },
  { name = "insn", kind = "option", type = "str", required = false, multiple = true, help = "insn uid whose single-set top priority is off (with --kind top-priority)" },
  { name = "block", kind = "option", type = "int", required = false, multiple = false, help = "basic block the changes act in, default 0" },
  { name = "search", kind = "option", type = "str", required = false, multiple = false, help = "singles, pairs or greedy: find the smallest set of extra changes of --kind that makes the function exact (greedy grows one set, then drops every member it can do without)" },
  { name = "only", kind = "option", type = "str", required = false, multiple = true, help = "search only among these insn uids" },
  { name = "direction", kind = "option", type = "str", required = false, multiple = false, help = "forward (default): B is scheduled before A in the block; any: B may follow A too" },
  { name = "window", kind = "option", type = "int", required = false, multiple = false, help = "search dependences between insns at most this many apart in the block, default 8" },
  { name = "top", kind = "option", type = "int", required = false, multiple = false, help = "pairs are built from this many best singles (those that changed the code first), default 40; with greedy the most changes a set grows to" },
  { name = "jobs", kind = "option", type = "int", required = false, multiple = false, help = "parallel compiles, default 4" },
  { name = "cpu-budget", kind = "option", type = "int", required = false, multiple = false, help = "stop the search after this many CPU seconds, default 240" },
  { name = "lines", kind = "option", type = "int", required = false, multiple = false, help = "instruction diff lines shown" },
  { name = "short", kind = "flag", type = "str", required = false, multiple = false, help = "show only the changed diff lines" },
]
[command.order]
help = "Climb the statement order of one function toward the ROM: move one statement at a time inside a window, never across a statement it shares a variable with, probe each order, keep the best; writes the best source to --out."
handler = "order.order_command"
params = [
  { name = "file", kind = "argument", type = "path", required = true, multiple = false, help = "C source holding the candidate function" },
  { name = "function", kind = "option", type = "str", required = true, multiple = false, help = "the function to reorder" },
  { name = "version", kind = "option", type = "str", required = false, multiple = false, help = "version to probe, default the names-from version" },
  { name = "window", kind = "option", type = "int", required = false, multiple = false, help = "statements a move may travel either way, default 6" },
  { name = "rounds", kind = "option", type = "int", required = false, multiple = false, help = "moves kept per block, default 3" },
  { name = "budget", kind = "option", type = "int", required = false, multiple = false, help = "at most this many probes (about a CPU second each), default 150" },
  { name = "toolchain", kind = "option", type = "str", required = false, multiple = false, help = "override the unit toolchain" },
  { name = "flag", kind = "option", type = "str", required = false, multiple = true, help = "add one compiler option" },
  { name = "omit-flag", kind = "option", type = "str", required = false, multiple = true, help = "remove one compiler option (with its operand)" },
  { name = "out", kind = "option", type = "path", required = false, multiple = false, help = "where the best source goes, default FILE.ordered.c" },
]

[command.deadcode]
help = "Report (never refuse) the statements cc1 deletes as dead in each function of one tree source: lines whose every insn the jump, cse or flow passes removed."
handler = "deadcode.deadcode_command"
params = [
  { name = "file", kind = "argument", type = "path", required = true, multiple = false, help = "tree source to compile with the RTL dumps" },
  { name = "function", kind = "option", type = "str", required = false, multiple = false, help = "report only this function" },
  { name = "version", kind = "option", type = "str", required = false, multiple = false, help = "version to compile, default the names-from version" },
]

[command.submit]
help = "Admit sources and put exact (or improved fuzzy) candidates in the landing inbox; landing starts if idle."
handler = "compare.submit_command"
params = [
  { name = "files", kind = "argument", type = "path", required = false, multiple = true, help = "C sources, then change-set files: PATH=FILE replaces the project file PATH (a header) with FILE" },
  { name = "batch-data", kind = "option", type = "path", required = false, multiple = false, help = "JSON list of {member, file}: prove extracted data together (written, built and linked whole under the exclusive tree lock), then restore the tracked tree and write the change as a patch" },
  { name = "pad-split", kind = "option", type = "path", required = false, multiple = false, help = "JSON list of {member, version, rom, vram} (the function's current row, per version that has an alignment pad word before its prologue): write the symbol rows of the pad word, the function moved to a file of its own and the pad's stand-in as a patch, tree restored" },
  { name = "boundary", kind = "flag", type = "str", required = false, multiple = false, help = "move the function rows a split put in the wrong place (a pad or the last word of the function before, a function cut in two, a prologue word alone) to where an exact function of another version sits in the ROM: symbol_addrs rows, the stand-ins of rows that go, sync, and a diff; rows no counterpart explains are described" },
  { name = "version", kind = "option", type = "str", required = false, multiple = true, help = "with --boundary: a version to search (repeat; default every version but names_from)" },
  { name = "check", kind = "flag", type = "str", required = false, multiple = false, help = "with --boundary: report the moves, write nothing" },
  { name = "patch", kind = "option", type = "path", required = false, multiple = false, help = "with --batch-data or --pad-split, where the patch goes (default .unbake/batch-data|pad-split/<digest>.patch)" },
  { name = "function", kind = "option", type = "str", required = false, multiple = false, help = "member, only with exactly one file" },
  { name = "bulk", kind = "flag", type = "str", required = false, multiple = false, help = "each source, with the PATH=FILE change-set files that follow it, is one candidate (member from the source name): admit all groups independently, a refusal blocks no other group, then run land once" },
  { name = "note", kind = "option", type = "str", required = false, multiple = false, help = "a free-text note recorded with the submission" },
]

[command.land]
help = "Land every inbox submission in order (or only the --only ids), writing each; abandoned entries go to inbox/attic; returns at once if a landing is already running."
handler = "land.land_command"
params = [
  { name = "only", kind = "option", type = "str", required = false, multiple = true, help = "land only this submission id (repeatable), leaving every other entry" },
]

[command.check]
help = "Census source rules over the whole project, or only the given units (and the units that read a given header)."
handler = "land.check_command"
params = [
  { name = "staged", kind = "flag", type = "str", required = false, multiple = false, help = "check only staged C/header text against HEAD; refuse new policy findings without builds" },
  { name = "paths", kind = "argument", type = "str", required = false, multiple = true, help = "limit the check (and --staged) to these project paths" },
  { name = "strict", kind = "flag", type = "str", required = false, multiple = false, help = "exit 1 when any debt exists" },
  { name = "repair", kind = "flag", type = "str", required = false, multiple = false, help = "first write the working tree so every header declaration of a name is its owner's alone (never commits)" },
]

[command.audit]
configured = false
help = "Refuse source rule rows the working tree adds over REV; no ROMs or host needed."
handler = "policy.audit_command"
params = [
  { name = "against", kind = "option", type = "str", required = true, multiple = false, help = "revision the working tree is compared with" },
]

[command.cheat]
help = "Refuse what a change adds over REV that could fake a match: assembly, raw words, pragmas, sections, a new INCLUDE_ASM, non-C source files, infrastructure edits, a Makefile change that is not a unit's compiler row or the generated one. A stand-in line sync itself writes passes."
handler = "cheat.cheat_command"
params = [
  { name = "against", kind = "option", type = "str", required = true, multiple = false, help = "base revision the change is compared with" },
  { name = "head", kind = "option", type = "str", required = false, multiple = false, help = "revision checked out in the tree, default HEAD; WORKTREE checks the uncommitted tree as it is" },
]

[command.renameproof]
configured = false
help = "Prove a change that only renames identifiers by its rename map (no build): the working tree, or PATCHes applied in order, over REV."
handler = "renameproof.rename_command"
params = [
  { name = "against", kind = "option", type = "str", required = true, multiple = false, help = "revision the change is measured from" },
  { name = "patch", kind = "option", type = "path", required = false, multiple = true, help = "a patch applied in order over REV in a private index; none means the working tree" },
  { name = "inert", kind = "option", type = "str", required = false, multiple = true, help = "glob of paths no build reads (a catalog of names) that may be added or changed" },
  { name = "steps", kind = "flag", type = "str", required = false, multiple = false, help = "judge each patch over the state the earlier ones leave and list every verdict" },
]
[command.lanecheck]
configured = false
help = "Refuse a hand lane's diff that touches a file another lane or GLOBALS owns (the file sets `decomp cleanup slices` wrote under NAMES/files); the refusal names the owner. A lane without a file set is a tool batch and passes."
handler = "lanecheck.lane_command"
params = [
  { name = "lane", kind = "option", type = "str", required = true, multiple = false, help = "the lane the diff comes from" },
  { name = "diff", kind = "option", type = "path", required = true, multiple = true, help = "a diff the lane queued (repeatable)" },
  { name = "names", kind = "option", type = "path", required = true, multiple = false, help = "the names directory holding files/<LANE>.json and files/GLOBALS.json" },
]
[command.narrow]
configured = false
help = "The includers of the headers a tree changes over REV that no edit can reach, per version (stamp records prove a unit built at REV); --apply signs their stamps and dates the rest for a rebuild, so `make -o HEADER` rebuilds only what the edit reaches."
handler = "hdrnarrow.narrow_command"
params = [
  { name = "against", kind = "option", type = "str", required = true, multiple = false, help = "revision the tree's build was made at (its stamp records)" },
  { name = "version", kind = "option", type = "str", required = false, multiple = true, help = "a version to narrow (repeatable; default: every built version)" },
  { name = "apply", kind = "flag", type = "str", required = false, multiple = false, help = "sign the unreachable includers' stamps and date the others for a rebuild" },
]
[command.buildproof]
help = "Build proof of a change that must alter no object: PATCHes over the clean tree at REV; builds every reachable unit before and after, compares the object sets and contents; fails on any make error, a missing or extra object, a difference or nothing compared."
handler = "buildproof.buildproof_command"
params = [
  { name = "against", kind = "option", type = "str", required = true, multiple = false, help = "revision the tree is checked out at" },
  { name = "reference", kind = "option", type = "path", required = false, multiple = false, help = "a tree built clean at REV (the pool's POOL-SRC) whose objects are the before: the change is this tree's own edits over REV, no PATCH, no reset" },
  { name = "patch", kind = "option", type = "path", required = false, multiple = true, help = "a patch applied in order over the tree (repeat)" },
  { name = "version", kind = "option", type = "str", required = false, multiple = true, help = "a version to prove (repeat); none means every version" },
  { name = "jobs", kind = "option", type = "int", required = false, multiple = false, help = "make jobs the build expects (default: the host's share)" },
]

[command.map]
help = "Write the layout map with its objective evidence to .unbake/map.json; writes nothing tracked."
handler = "report.map_command"
params = [
  { name = "moves", kind = "flag", type = "str", required = false, multiple = false, help = "also write .unbake/moves.jsonl: the full move stream (input of `unbake move -`) that places modules in src/game/<segment>/<subsystem> and src/sdk/<library>" },
  { name = "fakes", kind = "flag", type = "str", required = false, multiple = false, help = "only write .unbake/fakes.jsonl: type moves folding every invented per-function record into a real record that fits, one shared record per same-layout group, or its data symbol's owner-local record; .unbake/fakes.json holds each record's class and reason" },
]

[command.report]
help = "Progress per version, kind and segment; write progress.json schema 2."
handler = "report.run"
params = [
  { name = "next", kind = "flag", type = "str", required = false, multiple = false, help = "list unmatched functions by increasing size" },
  { name = "states", kind = "flag", type = "str", required = false, multiple = false, help = "only the three states (exact, fuzzy, none) of functions, code and data bytes per version, from the source alone (no build, compile or score); writes .unbake/states.json and nothing tracked" },
  { name = "unknown", kind = "flag", type = "str", required = false, multiple = false, help = "only the ROM spans no class holds, per version, each with its segment and size (the input of `blobs scan stale` and of a by-hand reading); writes .unbake/unknown.json and nothing tracked" },
  { name = "exact", kind = "option", type = "str", required = false, multiple = true, help = "a version whose last link matched the ROM (repeat). With --states, none given takes every version as linking exact; without it, the report is published on this verdict instead of a make check (the caller vouches for it)" },
]

[command.blobs]
help = "The blobs of blobs.toml (non-code ROM content), their census and the byte partition of every version; `import PACKET` merges evidence; `land PACKET` lands a facts-only packet checked and all-or-nothing, no ROM build; `prove REQUEST RECEIPT` writes independent typed-view evidence without rescoring; `scan` proves the RNC1 streams and lists stream candidates in unknown bytes; `scan stale` lists the object files, object code a known body explains, code streams (whole functions of canonical instructions) and exact copies of accounted bytes that fill unknown bytes, as `prove` rows."
handler = "blobs.run"
params = [
  { name = "action", kind = "argument", type = "str", required = false, multiple = true, help = "prove REQUEST RECEIPT, import PACKET, land PACKET, scan [stale], or nothing to list" },
  { name = "json", kind = "flag", type = "str", required = false, multiple = false, help = "also return every blob as a row" },
]

[command.verify]
configured = false
help = "Verify the built ROMs and record make's verdict for report; called by make check."
handler = "build.verify"
params = [
  { name = "status", kind = "argument", type = "int", required = false, multiple = false, help = "make exit status (default 0); a failure revokes matched credit" },
]

[command.names]
configured = false
help = "Map generic debug names/types to Recipe structure moves; no project writes."
handler = "symbols.names_command"
params = [
  { name = "input", kind = "argument", type = "path", required = true, multiple = false, help = "generic names/types JSON" },
  { name = "bindings", kind = "option", type = "path", required = false, multiple = false, help = "complete measured current type layouts with original identities" },
]

[command.types]
configured = false
help = "Propose record layouts from the assembly's loads and stores, diff them with the C headers, and settle header requests; writes nothing tracked."
handler = "layouts.types_command"
params = [
  { name = "version", kind = "option", type = "str", required = false, multiple = false, help = "version whose asm/<version> is read (default us-rev1)" },
  { name = "requests", kind = "option", type = "path", required = false, multiple = false, help = "a REQUESTS.md: say which open request lines the inferred layouts answer" },
  { name = "record", kind = "option", type = "str", required = false, multiple = true, help = "only these records (struct tag, or sym:NAME for a global)" },
  { name = "all", kind = "flag", type = "str", required = false, multiple = false, help = "also list the per-function argument records" },
  { name = "functions", kind = "option", type = "path", required = false, multiple = false, help = "only records these functions read or write: one symbol per line, or a TSV with a symbol column" },
  { name = "out", kind = "option", type = "path", required = false, multiple = false, help = "write the full JSON here and keep the result to counts" },
  { name = "text", kind = "option", type = "path", required = false, multiple = false, help = "write the human view (proposals and header disagreements) here" },
]
[command.compilers]
help = "Which compiler built each unit: fingerprint the built objects, census candidate compilers on the C functions, propose the smallest directory rows. Writes only .unbake/compilers."
handler = "compilers.run"
params = [
  { name = "action", kind = "argument", type = "str", required = true, multiple = false, help = "fingerprint | census | propose" },
  { name = "version", kind = "option", type = "str", required = false, multiple = false, help = "version whose build is read, default names_from" },
  { name = "toolchains", kind = "option", type = "str", required = false, multiple = false, help = "census: comma list of candidate toolchain ids, default every installed one of the project's family" },
  { name = "paths", kind = "option", type = "str", required = false, multiple = true, help = "only units under this source path prefix; once per prefix" },
  { name = "cpu", kind = "option", type = "int", required = false, multiple = false, help = "census: CPU seconds one call may spend before it stops and resumes next call, default 240" },
  { name = "drafts", kind = "flag", type = "str", required = false, multiple = false, help = "census: also judge the NON_MATCHING bodies of units that have them" },
]
[command.layout]
help = "Move a project's files to a target folder layout by rules: plan the map, apply it (files, config.toml rows, sync), carry uncommitted work across, verify the objects. Writes only .unbake/layout until apply."
handler = "folders.run"
params = [
  { name = "action", kind = "argument", type = "str", required = true, multiple = false, help = "plan | apply | literals | carry | verify | reorg | mergecheck" },
  { name = "rules", kind = "option", type = "path", required = false, multiple = false, help = "plan: the rules file ([[rule]] rows: match, to, optional row)" },
  { name = "map", kind = "option", type = "path", required = false, multiple = false, help = "plan, reorg: a map file, one `old path<TAB>new path` per file (headers too), added to the rules" },
  { name = "modules", kind = "option", type = "path", required = false, multiple = false, help = "mergecheck: a module map, a TSV with a header row holding `unit` and `module` columns" },
  { name = "ld", kind = "option", type = "str", required = false, multiple = false, help = "mergecheck: the link script of a version, a path with {version}, default build/{version}/link.ld" },
  { name = "obj", kind = "option", type = "str", required = false, multiple = false, help = "mergecheck: the object of a unit, a path with {version} and {unit}, default build/{version}/{unit}.o" },
  { name = "prove", kind = "flag", type = "str", required = false, multiple = false, help = "reorg: after the move run make check once, so every ROM is compared against the single move" },
  { name = "jobs", kind = "option", type = "int", required = false, multiple = false, help = "reorg --prove: make -j, default 4" },
  { name = "plan", kind = "option", type = "path", required = false, multiple = false, help = "apply, carry, verify: the plan file, default .unbake/layout/plan.json" },
  { name = "patch", kind = "option", type = "path", required = false, multiple = false, help = "carry: where to write the patch, default .unbake/layout/carry.patch" },
  { name = "old", kind = "option", type = "path", required = false, multiple = false, help = "verify: a directory holding the build tree and link script from before the move" },
]

