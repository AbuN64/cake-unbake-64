# Source rules. A rule has exactly one of `regex` (Python re, MULTILINE, matched against the text of its scope with
# comments and strings blanked for scope "code"/"directives", or the comments only for scope "comments") or `check`
# (one of policy.py's named checks). A waivable finding is waived by /* FAKEMATCH: <reason> */ on the same line
# or the line above. Unwaivable rules ignore FAKEMATCH.
schema = 1
# Rule ids whose findings keep a decompiled unit out of the exact credit: it counts as fuzzy at most.
unclean = ["struct-view-cast", "union-view", "fake-type", "param-cast", "address-int", "raw-offset", "pad-view", "placeholder-record", "duplicate-record"]

[[rule]]
id = "union-view"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a union gives one storage two types; declare the one real type"
regex = '\bunion\b'

[[rule]]
id = "inline-asm"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "inline assembly is never allowed"
regex = '\b(?:__asm__|__asm|asm)\s*(?:volatile\s*|__volatile__\s*)?\('

[[rule]]
id = "stand-in-body"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a stand-in line sits inside a function body; INCLUDE_ASM, INCLUDE_DATA and INCLUDE_RODATA stand for a whole item"
check = "stand-in-body"

[[rule]]
id = "duplicate-record"
severity = "Refuse"
scope = "code"
waivable = false
needs = "snapshot"
sentence = "a record repeats the body of another record; use the one record"
check = "duplicate-record"

[[rule]]
id = "volatile-storage"
severity = "Refuse"
needs = "snapshot"
scope = "code"
waivable = false
sentence = "volatile is allowed only for SDK hardware access or inside SDK library units"
check = "volatile"

[[rule]]
id = "raw-offset"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a raw byte offset is used instead of a typed field"
# `(u8 *)p + 4` (p a name or a parenthesized expression), a primitive pointer view of a variable indexed by a
# constant (`((s32 *)p)[44]`, `[176 / sizeof(s32)]`), or of an array element at a constant index (`(u32 *)&buf[0x18]`)
regex = '\(\s*(?:u8|s8|char|unsigned char)\s*\*\s*\)\s*(?:[A-Za-z_]\w*|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))\s*\+\s*(?:\(\s*)*(?:0[xX][0-9A-Fa-f]+|\d+)|\(\s*\(\s*(?:(?:const|volatile|unsigned|signed)\s+)*(?:[us](?:8|16|32|64)|f32|f64|float|double|char|short|int|long|void)\s*\*+\s*\)\s*[A-Za-z_]\w*\s*\)\s*\[\s*(?:0[xX][0-9A-Fa-f]*[1-9A-Fa-f][0-9A-Fa-f]*|[1-9]\d*)\s*(?:/\s*sizeof\s*\([^)]*\)\s*)?\]|\(\s*(?:(?:const|volatile|unsigned|signed)\s+)*(?:[us](?:8|16|32|64)|f32|f64|float|double|char|short|int|long|void)\s*\*+\s*\)\s*&\s*[A-Za-z_]\w*\s*\[\s*(?:0[xX][0-9A-Fa-f]*[1-9A-Fa-f][0-9A-Fa-f]*|[1-9]\d*)\s*\]'

[[rule]]
id = "local-include"
severity = "Refuse"
scope = "directives"
waivable = false
sentence = "a source file may include only headers under include/"
regex = '^[ \t]*#[ \t]*include[ \t]*"(?:\.\.?/|[^"]*(?:scratch|nonmatching|drafts)/)[^"]*"'

[[rule]]
id = "tool-comment"
severity = "Refuse"
scope = "comments"
waivable = false
sentence = "a tool comment is left in the source"
regex = '\b(?:m2c|unbake|TODO: decomp|permuter|Generated by)\b'

[[rule]]
id = "empty-loop"
severity = "Refuse"
scope = "code"
waivable = true
sentence = "an empty loop needs a FAKEMATCH reason"
check = "empty-loop"

[[rule]]
id = "local-define"
severity = "Refuse"
scope = "directives"
waivable = false
sentence = "a file-local macro belongs in a shared header"
regex = '^[ \t]*#[ \t]*define[ \t]+\w+'
files = "source"

[[rule]]
id = "raw-gfx"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a raw display list word is used instead of a GBI macro"
check = "raw-gfx"

[[rule]]
id = "shared-declarations"
severity = "Refuse"
needs = "snapshot"
scope = "code"
waivable = false
sentence = "a declaration that a header already provides is repeated in the source"
check = "shared-declarations"

[[rule]]
id = "decompiler-placeholder"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "an unresolved decompiler placeholder is left in the source"
regex = '\bM2C_\w+\b'

[[rule]]
id = "struct-view-cast"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a cast through a per-function struct view; use the real shared struct type"
regex = '\(\s*func_[0-9A-Fa-f]+(?:_\w+?)?_S\d+\s*\*\s*\)'

# Type debt: a finding is its rule and subject. The repo-wide count of each may never rise (policy.scope).
[[rule]]
id = "fake-type"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a per-function invented record type is named; use the real shared type"
check = "fake-type"

[[rule]]
id = "pad-view"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a struct is mostly padding arrays with at most three named fields; declare the real fields"
check = "pad-view"

[[rule]]
id = "placeholder-record"
severity = "Refuse"
scope = "code"
files = "source"
waivable = false
sentence = "a source file defines a record whose every field is an offset placeholder; use the real shared record"
check = "placeholder-record"

[[rule]]
id = "offset-name"
severity = "Refuse"
scope = "code"
waivable = false
needs = "snapshot"
sentence = "a field is named for an offset it does not sit at; fix the padding before it or the name"
check = "offset-name"

[[rule]]
id = "param-cast"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a void pointer or integer parameter is cast to a struct pointer; type the parameter"
check = "param-cast"

[[rule]]
id = "address-int"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "an address is cast to an integer; type the callee parameter as a pointer or declare the symbol as an array"
check = "address-int"

[[rule]]
id = "address-literal"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a ROM address is spelled as a number; name the symbol"
check = "address-literal"
needs = "snapshot"

[[rule]]
id = "subword-view"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a 4-byte scalar has another symbol pinned inside it (a sub-word view reads the wrong half on a little-endian host)"
check = "subword-view"
needs = "snapshot"

# Hardware access permitted by rule volatile-storage outside SDK units: a cast to a volatile pointer type whose
# operand expression contains a constant inside one of these ranges (physical RCP/PI/SI registers and their KSEG1
# mirrors). macros/types are the spellings reported in human sentences; the check itself runs on preprocessed text.
[hardware]
macros = ["IO_READ", "IO_WRITE"]
types = ["vu8", "vu16", "vu32", "vu64"]
address_ranges = [
  { start = 0x04000000, end = 0x04FFFFFF },
  { start = 0x05000000, end = 0x05FFFFFF },
  { start = 0x1FC00000, end = 0x1FCFFFFF },
  { start = 0xA4000000, end = 0xA4FFFFFF },
  { start = 0xA5000000, end = 0xA5FFFFFF },
  { start = 0xBFC00000, end = 0xBFCFFFFF },
]

# Opcodes (high byte of a display-list word) the raw-gfx rule treats as graphics commands.
[gfx]
opcodes = [
    1, 2, 5, 6, 8, 175, 179, 180, 182, 183, 185, 186, 188, 191, 215, 217,
    218, 219, 220, 221, 222, 223, 225, 226, 227, 228, 230, 231, 232, 233, 237, 238,
    240, 241, 242, 243, 244, 245, 246, 247, 248, 249, 250, 251, 252, 253, 254, 255,
]

[[rule]]
id = "symbol-name"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "names must be portable across every target in symbol-names.toml"
check = "symbol-name"

[[rule]]
id = "struct-return-void"
severity = "Refuse"
needs = "snapshot"
scope = "code"
waivable = false
sentence = "a function the tree defines as returning a record by value is declared void with a result pointer; declare it by value and let callers assign"
check = "struct-return-void"

[[rule]]
id = "value-alias"
severity = "Refuse"
scope = "directives"
waivable = false
sentence = "a function is aliased to a _value twin that wraps a struct return; keep one by-value body"
regex = '^[ \t]*#[ \t]*define[ \t]+(\w+)[ \t]+\1_value\b'
files = "source"

# What a change may not add (debtrules.py). `unbake audit --against` judges each rule on the rows a change adds over its
# base, so the old tree's leftovers never block anyone; a project's config.toml [audit] tables spell these keys over
# the defaults below.
[[rule]]
id = "hex-value"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a hex literal is a value, not a mask or address; write it in decimal, or name the constant it stands for"
check = "hex-value"

[[rule]]
id = "hex-review"
severity = "Warn"
scope = "code"
waivable = false
sentence = "a hex literal is an address, struct offset, float bits, power of two or other value a person must read; name it or write it as what it is"
check = "hex-review"

[[rule]]
id = "raw-data"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a word or byte array certainly holds another type (a long string, a table of symbol addresses, code); write what it is"
check = "raw-data"

[[rule]]
id = "raw-data-review"
severity = "Warn"
scope = "code"
waivable = false
sentence = "a word or byte array looks like another type (floats, short text, addresses, code); write what it is or say why it stays raw"
check = "raw-data-review"

[[rule]]
id = "raw-offset-cast"
severity = "Warn"
scope = "code"
waivable = false
sentence = "a byte offset is read through a cast or divided by its element size; use the record's field"
regex = '\*\s*\(\s*(?:(?:const|volatile|unsigned|signed)\s+)*(?:[us](?:8|16|32|64)|f32|f64|float|double|char|short|int|long|void)\s*\*+\s*\)\s*\(\s*(?:[A-Za-z_]\w*|\((?:[^()]|\([^()]*\))*\))\s*\+\s*(?:0[xX][0-9A-Fa-f]*[1-9A-Fa-f][0-9A-Fa-f]*|[1-9]\d*)\s*\)|\b[A-Za-z_]\w*\s*\[\s*(?:0[xX][0-9A-Fa-f]*[1-9A-Fa-f][0-9A-Fa-f]*|[1-9]\d*)\s*/\s*(?:\d+|sizeof\s*\([^)]*\))\s*\]'

[[rule]]
id = "placeholder-name"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a symbol, file or folder is named by an address or a placeholder; name it for what it is"
check = "placeholder-name"

[[rule]]
id = "stand-in"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "an assembly or data stand-in stands for source that is not written; write the C"
regex = '\b(?:INCLUDE_ASM|INCLUDE_DATA|INCLUDE_RODATA|GLOBAL_ASM)\b'

[[rule]]
id = "non-matching"
severity = "Refuse"
scope = "directives"
waivable = false
sentence = "a NON_MATCHING branch keeps source that does not match; make the one source match"
regex = '\bNON_MATCHING\b'

[[rule]]
id = "fakematch-note"
severity = "Refuse"
scope = "comments"
waivable = false
sentence = "a FAKEMATCH note admits source that is not the original; write the original source"
regex = '\bFAKEMATCH\b(?!\s*:\s*\S)'

[[rule]]
id = "guard-gap"
severity = "Warn"
scope = "code"
waivable = false
touching = true
sentence = "a function is C under one version guard and raw words under the other; compile the C in every version"
check = "guard-gap"

[[rule]]
id = "sdk-name"
severity = "Refuse"
scope = "code"
waivable = false
sentence = "a library root holds a name the SDK does not define, or a source file spells an SDK-reserved name"
check = "sdk-name"

[audit.hex]
small_max = 9
sentinels = [127, 255, 32767, 32768, 65535, 16777215, 2147483647, 2147483648, 4294967295]
address = [0x80000000, 0x807FFFFF]
hardware = [0xA0000000, 0xBFFFFFFF]
float_range = [1e-4, 1e7]
round_step = 4096
pow2_min = 256
flag_names = '(?i)flag|mask|bits|attr|button'
gbi = '^(gs?DP|gs?SP|gs?Dma|gs?Sets|gs?Move|gs?Im|G_)'

[audit.rawdata]
float_min_words = 2
float_range = [9.5367431640625e-07, 1048576.0]
float_digits = 6
float_long = 16
code_min_words = 8
code_share = 0.85
string_min_bytes = 4
string_min_chars = 3
string_certain_chars = 16
pointer_min_words = 2
address = [0x80000000, 0x807FFFFF]
pad_max_bytes = 8
allowed_names = '(TrailingBytes|[Pp]adding|LinkGapWords|RetainedWords)'

[audit.placeholder]
patterns = ['[A-Za-z]+_8[0-9A-Fa-f]{7}(?:_\w+)?', 'L8[0-9A-Fa-f]{7}', '\w*_(?:padding|pad|gap)_[0-9A-Fa-f]{4,8}', '(?:unk|sub)_\w*']
numbered_suffixes = ['Block', 'Words', 'Bytes', 'Span', 'Gap', 'Chunk', 'Run', 'Part', 'Piece', 'Pad', 'Padding']

[audit.sdk]
reserved = '^(?:__os|_[A-Z])'
prefixes = '^(?:__?)?(?:os|al|gu|ms|sn)'

[audit.generated]
paths = ['README.md', 'docs/map-*.json', 'docs/*.map.json', 'progress.json']
