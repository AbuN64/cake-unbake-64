# Source rules. A rule has exactly one of `regex` (Python re, MULTILINE, matched against the text of its scope with
# comments and strings blanked for scope "code"/"directives", or the comments only for scope "comments") or `check`
# (one of policy.py's named checks). A waivable finding is waived by /* FAKEMATCH: <reason> */ on the same line
# or the line above. Unwaivable rules ignore FAKEMATCH.
schema = 1
# Rule ids whose findings keep a decompiled unit out of the exact credit: it counts as fuzzy at most.
unclean = ["struct-view-cast", "union-view", "fake-type", "param-cast", "address-int", "raw-offset", "pad-view", "placeholder-record", "duplicate-record"]

[[rule]]
id = "union-view"
scope = "code"
waivable = false
sentence = "a union gives one storage two types; declare the one real type"
regex = '\bunion\b'

[[rule]]
id = "inline-asm"
scope = "code"
waivable = false
sentence = "inline assembly is never allowed"
regex = '\b(?:__asm__|__asm|asm)\s*(?:volatile\s*|__volatile__\s*)?\('

[[rule]]
id = "volatile-storage"
needs = "snapshot"
scope = "code"
waivable = false
sentence = "volatile is allowed only for SDK hardware access or inside SDK library units"
check = "volatile"

[[rule]]
id = "raw-offset"
scope = "code"
waivable = false
sentence = "a raw byte offset is used instead of a typed field"
regex = '\(\s*(?:u8|s8|char|unsigned char)\s*\*\s*\)\s*(?:[A-Za-z_]\w*|\(\s*[A-Za-z_]\w*\s*\))\s*\+\s*(?:\(\s*)*(?:0[xX][0-9A-Fa-f]+|\d+)'

[[rule]]
id = "local-include"
scope = "directives"
waivable = false
sentence = "a source file may include only headers under include/"
regex = '^[ \t]*#[ \t]*include[ \t]*"(?:\.\.?/|[^"]*(?:scratch|nonmatching|drafts)/)[^"]*"'

[[rule]]
id = "tool-comment"
scope = "comments"
waivable = false
sentence = "a tool comment is left in the source"
regex = '\b(?:m2c|unbake|TODO: decomp|permuter|Generated by)\b'

[[rule]]
id = "file-version-guard"
needs = "snapshot"
scope = "directives"
waivable = false
sentence = "a version guard is not allowed in a source file"
regex = '^[ \t]*#[ \t]*(?:if|ifdef|ifndef|elif)\b[^\n]*\bVERSION_\w+'

[[rule]]
id = "empty-loop"
scope = "code"
waivable = true
sentence = "an empty loop needs a FAKEMATCH reason"
check = "empty-loop"

[[rule]]
id = "local-define"
scope = "directives"
waivable = false
sentence = "a file-local macro belongs in a shared header"
regex = '^[ \t]*#[ \t]*define[ \t]+\w+'
files = "source"

[[rule]]
id = "raw-gfx"
scope = "code"
waivable = false
sentence = "a raw display list word is used instead of a GBI macro"
check = "raw-gfx"

[[rule]]
id = "shared-declarations"
needs = "snapshot"
scope = "code"
waivable = false
sentence = "a declaration that a header already provides is repeated in the source"
check = "shared-declarations"

[[rule]]
id = "decompiler-placeholder"
scope = "code"
waivable = false
sentence = "an unresolved decompiler placeholder is left in the source"
regex = '\bM2C_\w+\b'

[[rule]]
id = "struct-view-cast"
scope = "code"
waivable = false
sentence = "a cast through a per-function struct view; use the real shared struct type"
regex = '\(\s*func_[0-9A-Fa-f]+(?:_\w+?)?_S\d+\s*\*\s*\)'

# Type debt: a finding is its rule and subject. The repo-wide count of each may never rise (policy.scope).
[[rule]]
id = "fake-type"
scope = "code"
waivable = false
sentence = "a per-function invented record type is named; use the real shared type"
check = "fake-type"

[[rule]]
id = "pad-view"
scope = "code"
waivable = false
sentence = "a struct is mostly padding arrays with at most three named fields; declare the real fields"
check = "pad-view"

[[rule]]
id = "placeholder-record"
scope = "code"
files = "source"
waivable = false
sentence = "a source file defines a record whose every field is an offset placeholder; use the real shared record"
check = "placeholder-record"

[[rule]]
id = "duplicate-record"
scope = "code"
waivable = false
needs = "snapshot"
sentence = "a record is a duplicate of one shared canonical record; use the canonical"
check = "duplicate-record"

[[rule]]
id = "param-cast"
scope = "code"
waivable = false
sentence = "a void pointer or integer parameter is cast to a struct pointer; type the parameter"
check = "param-cast"

[[rule]]
id = "address-int"
scope = "code"
waivable = false
sentence = "an address is cast to an integer; type the callee parameter as a pointer or declare the symbol as an array"
check = "address-int"

[[rule]]
id = "address-literal"
scope = "code"
waivable = false
sentence = "a ROM address is spelled as a number; name the symbol"
check = "address-literal"
needs = "snapshot"

# Hardware access permitted by rule volatile-storage outside SDK units: a cast to a volatile pointer type whose
# operand expression contains a constant inside one of these ranges (physical RCP/PI/SI registers and their KSEG1
# mirrors). macros/types are the spellings reported in human sentences; the check itself runs on preprocessed text.
[hardware]
macros = ["IO_READ", "IO_WRITE"]
types = ["vu8", "vu16", "vu32", "vu64"]
address_ranges = [
  { start = 0x04000000, end = 0x04FFFFFF },
  { start = 0x05000000, end = 0x05FFFFFF },
  { start = 0x1FC00000, end = 0x1FCFFFFF },
  { start = 0xA4000000, end = 0xA4FFFFFF },
  { start = 0xA5000000, end = 0xA5FFFFFF },
  { start = 0xBFC00000, end = 0xBFCFFFFF },
]

# Opcodes (high byte of a display-list word) the raw-gfx rule treats as graphics commands.
[gfx]
opcodes = [
    1, 2, 5, 6, 8, 175, 179, 180, 182, 183, 185, 186, 188, 191, 215, 217,
    218, 219, 220, 221, 222, 223, 225, 226, 227, 228, 230, 231, 232, 233, 237, 238,
    240, 241, 242, 243, 244, 245, 246, 247, 248, 249, 250, 251, 252, 253, 254, 255,
]
