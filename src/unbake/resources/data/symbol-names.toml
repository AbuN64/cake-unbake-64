# Project-independent source naming contract. Zero means no fixed toolchain limit.
# These are C ABI families, not architecture guesses: the compiler owns decoration.
# Case-folded symbol uniqueness is a portability policy, not a COFF linker claim.
schema = 1

[keywords]
c = ["auto", "break", "case", "char", "const", "continue", "default", "do", "double", "else", "enum", "extern", "float", "for", "goto", "if", "inline", "int", "long", "register", "restrict", "return", "short", "signed", "sizeof", "static", "struct", "switch", "typedef", "union", "unsigned", "void", "volatile", "while", "_Alignas", "_Alignof", "_Atomic", "_Bool", "_Complex", "_Generic", "_Imaginary", "_Noreturn", "_Static_assert", "_Thread_local", "alignas", "alignof", "bool", "constexpr", "false", "nullptr", "static_assert", "thread_local", "true", "typeof", "typeof_unqual", "_BitInt"]
cpp = ["alignas", "alignof", "and", "and_eq", "asm", "bitand", "bitor", "bool", "catch", "char8_t", "char16_t", "char32_t", "class", "compl", "concept", "consteval", "constexpr", "constinit", "const_cast", "co_await", "co_return", "co_yield", "decltype", "delete", "dynamic_cast", "explicit", "export", "false", "friend", "mutable", "namespace", "new", "noexcept", "not", "not_eq", "nullptr", "operator", "or", "or_eq", "private", "protected", "public", "reinterpret_cast", "requires", "static_assert", "static_cast", "template", "this", "thread_local", "throw", "true", "try", "typeid", "typename", "using", "virtual", "wchar_t", "xor", "xor_eq"]
gcc = ["__asm", "__asm__", "__attribute", "__attribute__", "__auto_type", "__builtin_offsetof", "__complex", "__complex__", "__const", "__const__", "__extension__", "__inline", "__inline__", "__int128", "__label__", "__real__", "__imag__", "__restrict", "__restrict__", "__signed", "__signed__", "__thread", "__typeof", "__typeof__", "__volatile", "__volatile__"]
clang = ["__asm", "__asm__", "__attribute", "__attribute__", "__block", "__builtin_offsetof", "__declspec", "__int128", "__kindof", "__private_extern__", "__strong", "__weak", "__unsafe_unretained", "__autoreleasing", "__thread", "__typeof", "__typeof__"]
msvc = ["__asm", "__based", "__cdecl", "__declspec", "__except", "__fastcall", "__finally", "__forceinline", "__int8", "__int16", "__int32", "__int64", "__leave", "__restrict", "__stdcall", "__super", "__thiscall", "__try", "__unaligned", "__vectorcall", "__w64", "__ptr32", "__ptr64", "__sptr", "__uptr", "__uuidof", "__interface", "__if_exists", "__if_not_exists", "__event", "__hook", "__unhook", "__assume", "__noop", "__identifier"]

[target.elf-gcc]
keyword_sets = ["c", "cpp", "gcc"]
symbol_prefix = { default = "" }
identifier_pattern = '[A-Za-z_][A-Za-z0-9_]*'
identifier_max = 0
reserved = '__|^_[A-Z]'
reserved_global = '^_'
section_pattern = '[A-Za-z_.][A-Za-z0-9_.]*'
section_max = 0
file_pattern = '[A-Za-z0-9_][A-Za-z0-9_.-]*'
file_max = 255
file_reserved = '$^'
file_case_sensitive = true
symbol_case_sensitive = true
portable_symbol_case_sensitive = true
cxx_linkage = 'extern "C"'
explicit_asm_labels = false

[target.coff-mingw]
keyword_sets = ["c", "cpp", "gcc", "msvc"]
symbol_prefix = { i386 = "_", x86_64 = "", arm64 = "" }
identifier_pattern = '[A-Za-z_][A-Za-z0-9_]*'
identifier_max = 0
reserved = '__|^_[A-Z]'
reserved_global = '^_'
section_pattern = '[A-Za-z_.][A-Za-z0-9_.]*'
section_max = 8
file_pattern = '[A-Za-z0-9_][A-Za-z0-9_.-]*'
file_max = 255
file_reserved = '(?i)(?:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:[.]|$)|[. ]$'
file_case_sensitive = false
symbol_case_sensitive = true
portable_symbol_case_sensitive = false
cxx_linkage = 'extern "C"'
explicit_asm_labels = false

[target.macho-clang]
keyword_sets = ["c", "cpp", "clang"]
symbol_prefix = { default = "_" }
identifier_pattern = '[A-Za-z_][A-Za-z0-9_]*'
identifier_max = 0
reserved = '__|^_[A-Z]'
reserved_global = '^_'
section_pattern = '[A-Za-z_.][A-Za-z0-9_.]*'
section_max = 16
file_pattern = '[A-Za-z0-9_][A-Za-z0-9_.-]*'
file_max = 255
file_reserved = '$^'
file_case_sensitive = true
symbol_case_sensitive = true
portable_symbol_case_sensitive = true
cxx_linkage = 'extern "C"'
explicit_asm_labels = false

[target.android-clang]
keyword_sets = ["c", "cpp", "clang"]
symbol_prefix = { default = "" }
identifier_pattern = '[A-Za-z_][A-Za-z0-9_]*'
identifier_max = 0
reserved = '__|^_[A-Z]'
reserved_global = '^_'
section_pattern = '[A-Za-z_.][A-Za-z0-9_.]*'
section_max = 0
file_pattern = '[A-Za-z0-9_][A-Za-z0-9_.-]*'
file_max = 255
file_reserved = '$^'
file_case_sensitive = true
symbol_case_sensitive = true
portable_symbol_case_sensitive = true
cxx_linkage = 'extern "C"'
explicit_asm_labels = false

[target.msvc]
keyword_sets = ["c", "cpp", "msvc"]
symbol_prefix = { i386 = "_", x86_64 = "", arm64 = "" }
identifier_pattern = '[A-Za-z_][A-Za-z0-9_]*'
identifier_max = 247
reserved = '__|^_[A-Z]'
reserved_global = '^_'
section_pattern = '[A-Za-z_.][A-Za-z0-9_.]*'
section_max = 8
file_pattern = '[A-Za-z0-9_][A-Za-z0-9_.-]*'
file_max = 255
file_reserved = '(?i)(?:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:[.]|$)|[. ]$'
file_case_sensitive = false
symbol_case_sensitive = true
portable_symbol_case_sensitive = false
cxx_linkage = 'extern "C"'
explicit_asm_labels = false
